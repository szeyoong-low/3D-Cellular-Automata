name: CI

on:
  # push:
  #   branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

env:
  MAKEFILE_DIR: "."

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
    # clone the repo 
    - uses: actions/checkout@v4
    # - name: Install Dependencies
    #   run: 
    - name: Linter
      run: make -C ${{ env.MAKEFILE_DIR }} lint
    - name: Formatter
      run: make -C ${{ env.MAKEFILE_DIR }} format
    - name: Build
      run: make -C ${{ env.MAKEFILE_DIR }} build
